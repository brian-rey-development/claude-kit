[project]
name = "claude-kit"
version = "0.1.0"
description = "Themes, status line widgets and mini apps for Claude Code in iTerm2"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["fonttools>=4.59,<5", "pillow>=11,<12", "jsonschema>=4.23,<5"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N", "C4", "RET", "PL"]
ignore = ["PLR2004", "PLR0913"]

[tool.ruff.lint.isort]
known-first-party = ["claude_kit"]

[tool.pyright]
include = ["claude_kit", "tests", "themes", "docs"]
pythonVersion = "3.9"
typeCheckingMode = "strict"
# Pillow, fontTools and jsonschema expose members whose types are partly unknown; our own code stays strict.
reportUnknownMemberType = false
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
