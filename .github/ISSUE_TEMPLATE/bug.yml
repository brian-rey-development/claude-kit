name: Bug
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: kit apply moonlit, then ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `kit doctor`
      render: text
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: macOS, iTerm2 and Claude Code versions
